<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F5F0">
<title>Garima Didi: spoken English tests</title>
<meta name="description" content="Spoken English tests that children take on a phone, marked by AI and checked by a teacher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Mukta:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="home">
  <header class="topbar" style="padding:0"><span class="mark"><i>दी</i>Garima Didi</span></header>
  <div class="hello">
    <div class="big">नमस्ते!</div>
    <h1>Speak English with Garima Didi.</h1>
    <p>Didi asks. You answer aloud. Your teacher checks your work.</p>
  </div>
  <a class="door child" href="/test.html">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
    <span><b>I am a student</b><span>Take the speaking test. About 40 minutes.</span></span>
  </a>
  <a class="door teacher" href="/teacher.html">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>
    <span><b>I am a teacher</b><span>See marks, listen to answers and sign off.</span></span>
  </a>
</main>
</body>
</html>
